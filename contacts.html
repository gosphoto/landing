  <body class="contacts-page">
    <header class="site-header">
      <a class="logo" href="/" aria-label="Госфото">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28" fill="none">
            <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2.2" />
            <circle cx="16" cy="16" r="6.5" stroke="currentColor" stroke-width="2.2" />
            <circle cx="22.5" cy="9.5" r="1.6" fill="currentColor" />
          </svg>
        </span>
        <span class="logo-text">Госфото</span>
      </a>

      <nav class="nav" aria-label="Основное меню">
        <a href="/#docs" data-metrika-goal="click_nav" data-metrika-param="contacts_docs">Документы</a>
        <a href="/#how" data-metrika-goal="click_nav" data-metrika-param="contacts_how">Как это работает</a>
        <a href="/#guarantee" data-metrika-goal="click_nav" data-metrika-param="contacts_guarantee">Гарантия</a>
        <a href="/#about" data-metrika-goal="click_nav" data-metrika-param="contacts_about">О сервисе</a>
      </nav>

      <button class="nav-toggle" type="button" aria-label="Меню" aria-expanded="false" data-metrika-goal="click_nav_toggle">
        <span></span><span></span>
      </button>
    </header>

    <main class="contacts-page-main">
      <section class="contacts-panel">
        <h1>Обратная связь</h1>
        <p class="contacts-lead">Напишите нам — ответим на ваш email в течение дня.</p>
        <form class="contacts-form" id="feedback-form" novalidate>
          <div class="contacts-field">
            <label for="feedback-email">Email для ответа</label>
            <input
              id="feedback-email"
              name="email"
              type="email"
              required
              maxlength="254"
              autocomplete="email"
            />
          </div>
          <div class="contacts-field">
            <label for="feedback-message">Сообщение</label>
            <textarea
              id="feedback-message"
              name="message"
              required
              minlength="10"
              maxlength="4000"
            ></textarea>
          </div>
          <div class="contacts-field">
            <label for="feedback-photo">Фото (необязательно)</label>
            <div class="contacts-photo-row">
              <input
                id="feedback-photo"
                name="photo"
                type="file"
                accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp"
              />
              <button type="button" class="btn btn-dark" id="feedback-photo-clear" hidden>
                Убрать фото
              </button>
            </div>
            <span class="contacts-photo-name" id="feedback-photo-name"></span>
          </div>
          <button class="btn btn-primary" type="submit" id="feedback-submit">Отправить</button>
          <p class="contacts-status" id="feedback-status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-brand">
        <span class="logo-text">Госфото</span>
        <p>Фото для Госуслуг · gosphoto.ru</p>
      </div>
      <div class="footer-links">
        <a href="/#docs">Документы</a>
        <a href="/#how">Как это работает</a>
        <a href="/#guarantee">Гарантия</a>
        <a href="/contacts" data-metrika-goal="click_contact_email" data-metrika-param="footer">Контакты</a>
      </div>
      <p class="footer-copy">© Госфото</p>
    </footer>

    <script>
      (function () {
        const METRIKA_ID = 111303098;
        const toggle = document.querySelector(".nav-toggle");
        const nav = document.querySelector(".nav");
        if (toggle && nav) {
          toggle.addEventListener("click", function () {
            const open = nav.classList.toggle("is-open");
            toggle.setAttribute("aria-expanded", open ? "true" : "false");
          });
        }

        function reachGoal(name, params) {
          try {
            if (typeof ym !== "function" || !name) return;
            if (params) ym(METRIKA_ID, "reachGoal", name, params);
            else ym(METRIKA_ID, "reachGoal", name);
          } catch (_) {}
        }

        document.addEventListener(
          "click",
          function (event) {
            const target = event.target.closest("[data-metrika-goal]");
            if (!target) return;
            const goal = target.getAttribute("data-metrika-goal");
            const param = target.getAttribute("data-metrika-param");
            reachGoal(goal, param ? { item: param } : undefined);
          },
          true
        );

        reachGoal("contacts_page_view");

        const form = document.getElementById("feedback-form");
        const email = document.getElementById("feedback-email");
        const message = document.getElementById("feedback-message");
        const photo = document.getElementById("feedback-photo");
        const photoName = document.getElementById("feedback-photo-name");
        const photoClear = document.getElementById("feedback-photo-clear");
        const submit = document.getElementById("feedback-submit");
        const status = document.getElementById("feedback-status");

        function setStatus(text, kind) {
          status.textContent = text || "";
          status.classList.remove("is-error", "is-ok");
          if (kind) status.classList.add(kind);
        }

        photo.addEventListener("change", function () {
          const f = photo.files && photo.files[0];
          photoName.textContent = f ? f.name : "";
          photoClear.hidden = !f;
          if (f) reachGoal("feedback_photo_attach");
        });
        photoClear.addEventListener("click", function () {
          photo.value = "";
          photoName.textContent = "";
          photoClear.hidden = true;
          reachGoal("feedback_photo_clear");
        });

        form.addEventListener("submit", async function (e) {
          e.preventDefault();
          setStatus("");
          const body = new FormData();
          body.append("email", email.value.trim());
          body.append("message", message.value.trim());
          const hasPhoto = !!(photo.files && photo.files[0]);
          if (hasPhoto) body.append("photo", photo.files[0]);
          submit.disabled = true;
          reachGoal("feedback_submit", { has_photo: hasPhoto ? "yes" : "no" });
          try {
            const res = await fetch("/api/feedback", { method: "POST", body: body });
            if (!res.ok) {
              let detail = "Не удалось отправить. Попробуйте позже.";
              try {
                const j = await res.json();
                if (j && j.detail) {
                  detail = typeof j.detail === "string" ? j.detail : detail;
                }
              } catch (_) {}
              setStatus(detail, "is-error");
              reachGoal("feedback_fail", {
                reason: "http_" + res.status,
                has_photo: hasPhoto ? "yes" : "no",
              });
              return;
            }
            form.reset();
            photoName.textContent = "";
            photoClear.hidden = true;
            setStatus("Сообщение отправлено. Мы ответим на ваш email.", "is-ok");
            reachGoal("feedback_ok", { has_photo: hasPhoto ? "yes" : "no" });
          } catch (_) {
            setStatus("Сеть недоступна. Попробуйте позже.", "is-error");
            reachGoal("feedback_fail", {
              reason: "network",
              has_photo: hasPhoto ? "yes" : "no",
            });
          } finally {
            submit.disabled = false;
          }
        });
      })();
    </script>
  </body>
</html>

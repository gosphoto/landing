# gosphoto.ru — HTTP only (before TLS cert exists)

server {
    listen 80;
    listen [::]:80;
    server_name gosphoto.ru www.gosphoto.ru;

    root /var/www/gosphoto.ru;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        allow all;
    }

    location ^~ /api/ {
        client_max_body_size 20m;
        proxy_pass http://80.87.196.33:8111/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location = /health {
        proxy_pass http://80.87.196.33:8111/health;
        proxy_set_header Host $host;
    }

    location ~ "^/result/[a-f0-9]{32}$" {
        try_files /result.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /contacts {
        try_files /contacts.html =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

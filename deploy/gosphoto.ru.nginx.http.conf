# gosphoto.ru — HTTP only (before TLS cert exists)

server {
    listen 80;
    listen [::]:80;
    server_name gosphoto.ru www.gosphoto.ru;

    root /var/www/gosphoto.ru;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        allow all;
    }

    location ^~ /api/ {
        client_max_body_size 20m;
        proxy_pass http://80.87.196.33:8111/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }

    location = /health {
        proxy_pass http://80.87.196.33:8111/health;
        proxy_set_header Host $host;
    }

    location ~ "^/result/[a-f0-9]{32}/view$" {
        try_files /view.html =404;
        add_header Cache-Control "no-cache";
    }

    location ~ "^/result/[a-f0-9]{32}$" {
        try_files /result.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /contacts {
        try_files /contacts.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /rekvizity {
        try_files /rekvizity.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /privacy {
        try_files /privacy.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /offer {
        try_files /offer.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /pers {
        try_files /pers.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /foto-na-zagranpasport {
        try_files /foto-na-zagranpasport.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /foto-na-zagranpasport.html {
        return 301 /foto-na-zagranpasport;
    }

    location = /foto-na-pasport {
        try_files /foto-na-pasport.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /foto-na-pasport.html {
        return 301 /foto-na-pasport;
    }

    location = /ne-prinimaet-foto-na-gosuslugah {
        try_files /ne-prinimaet-foto-na-gosuslugah.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /ne-prinimaet-foto-na-gosuslugah.html {
        return 301 /ne-prinimaet-foto-na-gosuslugah;
    }

    location = /kak-sdelat-foto-na-gosuslugi {
        try_files /kak-sdelat-foto-na-gosuslugi.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /kak-sdelat-foto-na-gosuslugi.html {
        return 301 /kak-sdelat-foto-na-gosuslugi;
    }

    location = /trebovaniya-k-foto-na-zagranpasport {
        try_files /trebovaniya-k-foto-na-zagranpasport.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /trebovaniya-k-foto-na-zagranpasport.html {
        return 301 /trebovaniya-k-foto-na-zagranpasport;
    }

    location = /trebovaniya-k-foto-na-pasport {
        try_files /trebovaniya-k-foto-na-pasport.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /trebovaniya-k-foto-na-pasport.html {
        return 301 /trebovaniya-k-foto-na-pasport;
    }

    location = /trebovaniya-k-foto-na-gosuslugi {
        try_files /trebovaniya-k-foto-na-gosuslugi.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /trebovaniya-k-foto-na-gosuslugi.html {
        return 301 /trebovaniya-k-foto-na-gosuslugi;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        return 301 /;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
